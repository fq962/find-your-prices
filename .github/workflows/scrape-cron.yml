# Scraping horario, corrido aqui mismo en el runner de GitHub.
#
# No pasa por el sitio: Cloudflare Workers (plan Free) permite 50 subrequests
# por invocacion y cada pagina de una tienda y cada llamada a Supabase cuentan,
# asi que un catalogo grande no cabe. Aca el scraper es Node normal contra
# Supabase, sin techo de subrequests ni de CPU. Ver scripts/run-scrape.ts.
#
# Secretos de repositorio requeridos:
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SECRET_KEY        (la service key; ignora RLS)
#
# Ponerse al dia: Actions > Scraping > Run workflow con "until_empty" marcado
# repite tandas hasta que no queden targets vencidos.

name: Scraping

on:
  schedule:
    # UTC. Honduras es UTC-6 todo el año, asi que la hora en punto coincide.
    # GitHub puede atrasar el disparo unos minutos; las anclas de la agenda
    # van 5 min antes de la hora, asi que no se pierde nada.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Targets por tanda
        default: '2'
      until_empty:
        description: Repetir tandas hasta que no queden vencidos
        type: boolean
        default: false

# Dos tandas a la vez solo pelearian por el mismo lock de targets.
concurrency:
  group: scraping
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Correr tandas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPE_LIMIT: ${{ inputs.limit || '2' }}
          SCRAPE_UNTIL_EMPTY: ${{ inputs.until_empty || false }}
        # `react-server` hace que `import 'server-only'` resuelva al modulo vacio.
        run: npx --yes tsx@4 --conditions=react-server scripts/run-scrape.ts
